{% extends "base.html" %}

{% block title %}Добавить товар{% endblock %}

{% block content %}
<h1>Добавить товар</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>
<p><a href="{% url 'products:product_list' %}">Вернуться к списку</a></p>
{% endblock %}
