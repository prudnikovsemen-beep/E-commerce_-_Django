<h1>Каталог товаров</h1>
<div class="products-grid">
    {% for product in products %}
        <div class="card">
            <h2>{{ product.name }}</h2>
            <p>{{ product.description|truncatechars:100 }}</p>
            <!-- Критерий: обрезано описание до 100 символов -->
            <p>Цена: {{ product.price }} ₽</p>
            <a href="{% url 'product_detail' pk=product.pk %}">Подробнее</a>
            <!-- Критерий: переходы с главной на товар -->
        </div>
    {% empty %}
        <p>Товаров пока нет.</p>
    {% endfor %}
</div>
