<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог товаров</title>
</head>
<body>
    <h1>Добро пожаловать в каталог товаров!</h1>
    <p>Здесь скоро появятся реальные товары из базы данных.</p>

    <!-- Сюда мы позже выведем список товаров циклом -->
    <ul>
    {% for product in products %}
        <li>
            Товар №{{ forloop.counter }}: {{ product.name }} (цена: {{ product.price }} ₽)
        </li>
    {% empty %}
        <li>Пока товаров нет в базе данных.</li>
    {% endfor %}
</ul>
</body>
</html>
