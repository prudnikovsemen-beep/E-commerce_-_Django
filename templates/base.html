{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <!-- ШАПКА -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">ЛОГОТИП</a>
            <nav class="main-nav">
                <a href="{% url 'catalog:product_list' %}">Каталог</a>
                <a href="{% url 'catalog:contacts' %}">Контакты</a>
                <a href="{% url 'blog:blog_list' %}">Блог</a>
            </nav>
            <a href="#" class="cart-link">Корзина</a>
        </div>
    </header>

    <!-- СТРОКА ПОИСКА -->
    <form class="search-form" action="#" method="get">
        <input type="text" name="q" placeholder="Поиск по товарам…" required>
        <button type="submit">Найти</button>
    </form>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <!-- ПОДВАЛ -->
    <footer class="site-footer">
        <div class="footer-inner">
            <a href="{% url 'catalog:contacts' %}">О нас</a>
            <a href="#">Доставка</a>
            <a href="#">Возврат</a>
            <a href="/admin/">Админка</a>
        </div>
        <p class="copyright">&copy; 2024 Магазин. Все права защищены.</p>
    </footer>
</body>
</html>
