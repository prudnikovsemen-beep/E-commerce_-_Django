{% extends "catalog/base.html" %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2>Добавить товар</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label for="{{ form.name.id_for_label }}" class="form-label">Название</label>
            {{ form.name }}
            <div class="text-danger">{{ form.name.errors }}</div>
        </div>

        <div class="mb-3">
            <label for="{{ form.description.id_for_label }}" class="form-label">Описание</label>
            {{ form.description }}
            <div class="text-danger">{{ form.description.errors }}</div>
        </div>

        <div class="mb-3">
            <label for="{{ form.price.id_for_label }}" class="form-label">Цена</label>
            {{ form.price }}
            <div class="text-danger">{{ form.price.errors }}</div>
        </div>

        <div class="mb-3">
            <label for="{{ form.image.id_for_label }}" class="form-label">Изображение</label>
            {{ form.image }}
            <div class="text-danger">{{ form.image.errors }}</div>
        </div>

        <button type="submit" class="btn btn-primary">Добавить продукт</button>
        <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
