{% extends 'base.html' %}
{% block title %}Удаление записи{% endblock %}
{% block content %}
    <!-- Поднавигация: Лента / Статьи / Видео -->
    {% include "blog/includes/blog_nav.html" %}

    <div class="container my-5 text-center" style="max-width: 560px;">
        <h1 class="mb-3">Удалить запись «{{ object.title }}»?</h1>
        <p class="text-muted mb-4">Действие необратимо — запись исчезнет из ленты навсегда.</p>

        <form method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
        </form>
        <a href="{% url 'blog:blog_detail' object.pk %}" class="btn btn-outline-secondary">Отмена</a>
    </div>
{% endblock %}
